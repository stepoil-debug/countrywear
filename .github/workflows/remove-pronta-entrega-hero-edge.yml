name: Remove Pronta Entrega hero white edge

on:
  push:
    paths:
      - '.github/workflows/remove-pronta-entrega-hero-edge.yml'

permissions:
  contents: write

jobs:
  fix-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch hero edge
        shell: bash
        run: |
          cat >> assets/css/catalog-hero-contain.css <<'EOF'

          /* Final seam cleanup: mask the 1px light edge without changing the hero composition. */
          body[data-page="catalog"] .catalog-hero,
          body[data-page="catalog"] .catalog-hero--order {
            margin-bottom: -1px !important;
            border: 0 !important;
            outline: 0 !important;
            box-shadow: none !important;
          }

          body[data-page="catalog"] .catalog-hero::after,
          body[data-page="catalog"] .catalog-hero--order::after {
            content: "" !important;
            display: block !important;
            position: absolute !important;
            inset: 0 !important;
            z-index: 1 !important;
            pointer-events: none !important;
            box-shadow: inset 0 0 0 1px #080604 !important;
          }

          body[data-page="catalog"] .catalog-hero > .container,
          body[data-page="catalog"] .catalog-hero--order > .container {
            z-index: 2 !important;
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/catalog-hero-contain.css
          git commit -m "fix: remove white edge from Pronta Entrega hero" || exit 0
          git push origin HEAD:main
